name: REV Coop tools

on:
  push:
    paths:
      - 'projetos/REV_Coop/tools/**'
      - 'projetos/REV_Coop/src/**'
      - 'projetos/REV_Coop/tests/**'
      - '.github/workflows/rev-tools.yml'
  pull_request:
    paths:
      - 'projetos/REV_Coop/tools/**'
      - 'projetos/REV_Coop/src/**'
      - 'projetos/REV_Coop/tests/**'
      - '.github/workflows/rev-tools.yml'
  workflow_dispatch:

jobs:
  ppc-minidisasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and smoke-test PowerPC decoder
        run: bash projetos/REV_Coop/tools/test_ppc_minidisasm.sh

  control-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test single-controller router
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iprojetos/REV_Coop/src \
            projetos/REV_Coop/src/rev_control_router.c \
            projetos/REV_Coop/tests/test_control_router.c \
            -o /tmp/test_rev_router
          /tmp/test_rev_router
      - name: Compile and test local actor input dispatcher
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iprojetos/REV_Coop/src \
            projetos/REV_Coop/src/rev_control_router.c \
            projetos/REV_Coop/src/rev_local_input.c \
            projetos/REV_Coop/tests/test_local_input.c \
            -o /tmp/test_rev_local_input
          /tmp/test_rev_local_input
